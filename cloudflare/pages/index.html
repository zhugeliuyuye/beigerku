<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>贝格书库</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js"></script>
    <script src="./config.js"></script>
    <style>
      :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      body { margin: 0; background: #f4f6f8; color: #172033; }
      main { max-width: 1000px; margin: 0 auto; padding: 24px; }
      header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
      h1 { margin: 0 0 8px; font-size: 28px; }
      h2 { margin: 0 0 14px; font-size: 18px; }
      label { display: block; margin-bottom: 6px; color: #344054; font-size: 14px; }
      .panel { background: #fff; border: 1px solid #dde3ea; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
      .login { max-width: 440px; margin: 10vh auto 0; }
      .muted { color: #667085; font-size: 14px; }
      .error { color: #b42318; min-height: 22px; margin-top: 10px; }
      .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
      .grow { flex: 1 1 240px; }
      input, select, button { font: inherit; }
      input, select { padding: 10px 12px; border: 1px solid #cfd7df; border-radius: 6px; box-sizing: border-box; background: #fff; }
      input[type="email"], input[type="password"] { width: 100%; }
      button { padding: 10px 14px; border: 0; border-radius: 6px; background: #24765e; color: #fff; cursor: pointer; }
      button.secondary { background: #e8edf2; color: #172033; }
      button.danger { background: #b42318; }
      button:disabled { opacity: .55; cursor: wait; }
      .field { margin-top: 12px; }
      .file-list { list-style: none; padding: 0; margin: 0; }
      .file-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid #edf0f2; }
      .file-item:last-child { border-bottom: 0; }
      .file-name { min-width: 0; overflow-wrap: anywhere; }
      .file-meta { color: #667085; font-size: 13px; margin-top: 3px; }
      .empty { color: #667085; padding: 12px 0; }
      .hidden { display: none !important; }
      @media (max-width: 640px) {
        main { padding: 16px; }
        header { display: block; }
        header button { margin-top: 12px; }
        .file-item { align-items: flex-start; flex-direction: column; }
      }
    </style>
  </head>
  <body>
    <main>
      <section id="loginPanel" class="panel login">
        <h1>贝格书库</h1>
        <p class="muted">Supabase 免费存储版</p>
        <form id="loginForm">
          <div class="field">
            <label for="email">邮箱</label>
            <input id="email" type="email" autocomplete="email" required />
          </div>
          <div class="field">
            <label for="password">密码</label>
            <input id="password" type="password" autocomplete="current-password" required />
          </div>
          <button type="submit" style="margin-top: 14px">登录</button>
          <div id="loginError" class="error" role="alert"></div>
        </form>
      </section>

      <section id="app" class="hidden">
        <header>
          <div>
            <h1>贝格书库</h1>
            <div id="account" class="muted">Pages 前端 · Supabase Auth · Supabase Storage</div>
          </div>
          <button id="logout" class="secondary">退出登录</button>
        </header>

        <section class="panel">
          <h2>上传资料</h2>
          <div class="row">
            <select id="category" class="grow" aria-label="资料分类"></select>
            <input id="fileInput" type="file" class="grow" />
            <button id="upload">上传</button>
          </div>
          <div id="uploadStatus" class="muted" style="margin-top: 10px"></div>
        </section>

        <section class="panel">
          <div class="row" style="justify-content: space-between">
            <h2 style="margin: 0">资料列表</h2>
            <button id="refresh" class="secondary">刷新</button>
          </div>
          <div id="listStatus" class="muted" style="margin-top: 10px"></div>
          <ul id="files" class="file-list"></ul>
        </section>
      </section>
    </main>

    <script>
      const CATEGORIES = [
        "01 编程与技术",
        "02 英语与语言",
        "03 考试与课程",
        "04 阅读与论文",
        "05 笔记与总结",
        "99 待整理",
      ];
      const BUCKET = window.LIBRARY_BUCKET || "library";
      const client = window.supabase.createClient(
        window.SUPABASE_URL,
        window.SUPABASE_PUBLISHABLE_KEY,
      );

      const loginPanel = document.getElementById("loginPanel");
      const app = document.getElementById("app");
      const loginError = document.getElementById("loginError");
      const category = document.getElementById("category");
      const fileInput = document.getElementById("fileInput");
      const filesEl = document.getElementById("files");
      const listStatus = document.getElementById("listStatus");
      const uploadStatus = document.getElementById("uploadStatus");
      const account = document.getElementById("account");

      let currentUser = null;

      function showApp() {
        loginPanel.classList.add("hidden");
        app.classList.remove("hidden");
      }

      function showLogin() {
        app.classList.add("hidden");
        loginPanel.classList.remove("hidden");
      }

      function storagePrefix() {
        return `${currentUser.id}/${category.value}`;
      }

      function filePath(fileName) {
        return `${storagePrefix()}${fileName}`;
      }

      function formatSize(bytes) {
        if (bytes < 1024) return `${bytes} B`;
        if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
        return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
      }

      function fillCategories() {
        category.innerHTML = "";
        CATEGORIES.forEach((name) => {
          const option = document.createElement("option");
          option.value = `${name}/`;
          option.textContent = name;
          category.appendChild(option);
        });
      }

      async function requireUser() {
        const { data, error } = await client.auth.getUser();
        if (error || !data.user) {
          currentUser = null;
          showLogin();
          return false;
        }
        currentUser = data.user;
        account.textContent = `${data.user.email} · Supabase Storage`;
        showApp();
        return true;
      }

      async function loadFiles() {
        if (!currentUser) return;
        listStatus.textContent = "加载中…";
        filesEl.innerHTML = "";
        const { data, error } = await client.storage.from(BUCKET).list(storagePrefix(), {
          limit: 100,
          sortBy: { column: "updated_at", order: "desc" },
        });
        if (error) {
          listStatus.textContent = error.message;
          return;
        }
        const files = (data || []).filter((item) => item.name && item.metadata);
        if (!files.length) {
          filesEl.innerHTML = '<li class="empty">这个分类还没有资料。</li>';
          listStatus.textContent = "共 0 个文件";
          return;
        }
        files.forEach((item) => {
          const fullPath = filePath(item.name);
          const li = document.createElement("li");
          li.className = "file-item";

          const info = document.createElement("div");
          info.className = "file-name";
          const name = document.createElement("div");
          name.textContent = item.name;
          const meta = document.createElement("div");
          meta.className = "file-meta";
          const size = item.metadata?.size ? formatSize(item.metadata.size) : "未知大小";
          meta.textContent = `${size} · ${item.updated_at ? new Date(item.updated_at).toLocaleString() : ""}`;
          info.append(name, meta);

          const actions = document.createElement("div");
          actions.className = "row";
          const download = document.createElement("button");
          download.textContent = "下载";
          download.addEventListener("click", () => downloadFile(fullPath, item.name, download));
          const remove = document.createElement("button");
          remove.textContent = "删除";
          remove.className = "danger";
          remove.addEventListener("click", () => deleteFile(fullPath, item.name));
          actions.append(download, remove);
          li.append(info, actions);
          filesEl.appendChild(li);
        });
        listStatus.textContent = `共 ${files.length} 个文件`;
      }

      async function downloadFile(path, name, button) {
        button.disabled = true;
        const { data, error } = await client.storage.from(BUCKET).download(path);
        button.disabled = false;
        if (error) {
          listStatus.textContent = error.message;
          return;
        }
        const link = document.createElement("a");
        link.href = URL.createObjectURL(data);
        link.download = name;
        link.click();
        URL.revokeObjectURL(link.href);
      }

      async function deleteFile(path, name) {
        if (!confirm(`确定删除“${name}”吗？`)) return;
        const { error } = await client.storage.from(BUCKET).remove([path]);
        if (error) {
          listStatus.textContent = error.message;
          return;
        }
        await loadFiles();
      }

      document.getElementById("loginForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        loginError.textContent = "";
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const { error } = await client.auth.signInWithPassword({ email, password });
        if (error) {
          loginError.textContent = error.message;
          return;
        }
        document.getElementById("password").value = "";
        if (await requireUser()) await loadFiles();
      });

      document.getElementById("upload").addEventListener("click", async () => {
        const file = fileInput.files[0];
        if (!file) {
          uploadStatus.textContent = "请选择一个文件。";
          return;
        }
        uploadStatus.textContent = "上传中…";
        const { error } = await client.storage.from(BUCKET).upload(filePath(file.name), file, {
          cacheControl: "3600",
          upsert: false,
        });
        if (error) {
          uploadStatus.textContent = error.message;
          return;
        }
        fileInput.value = "";
        uploadStatus.textContent = "上传完成。";
        await loadFiles();
      });

      category.addEventListener("change", loadFiles);
      document.getElementById("refresh").addEventListener("click", loadFiles);
      document.getElementById("logout").addEventListener("click", async () => {
        await client.auth.signOut();
        currentUser = null;
        showLogin();
      });

      fillCategories();
      requireUser().then((ok) => {
        if (ok) loadFiles();
      });
    </script>
  </body>
</html>
